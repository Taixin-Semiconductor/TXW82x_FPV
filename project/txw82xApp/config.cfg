// 双斜杠是注释
// 如果为空,则会赋值为0xff,或者写 PIN_DEFAULT
// 这里的配置要与pin_param.h的一样,否则可能不会配置成功

//这个配置的版号:TXW827_C0X_BATTERY_CAMERA_V1.2_20260613

//串口的io
PIN_UART0_TX 	= 	PD_5
PIN_UART0_RX 	= 	PD_4

//sd卡的io
PIN_SDH_CLK 	= 	PB_12
PIN_SDH_CMD 	= 	PB_13   
PIN_SDH_DAT0 	= 	PB_11
PIN_SDH_DAT1 	= 	PB_10
PIN_SDH_DAT2 	= 	PB_15
PIN_SDH_DAT3 	= 	PB_14


//摄像头的io
PIN_CSI0_RESET 		= PC_10
//摄像头mclk的io
PIN_PWM_CHANNEL_1	= 	PC_13

PIN_CSI0_PDN        =   PC_9
	
//mipi的io
PIN_MIPI_CSI0_CLKN 	=	PA_4
PIN_MIPI_CSI0_CLKP	=	PA_5
PIN_MIPI_CSI0_D0N	=	PA_0
PIN_MIPI_CSI0_D0P	=	PA_1
PIN_MIPI_CSI0_D1N_CSI1_D0N =	PA_2
PIN_MIPI_CSI0_D1P_CSI1_D0P =	PA_3


//mipi0摄像头的iic
PIN_MIPI0_IIC_CLK = PC_12
PIN_MIPI0_IIC_SDA = PC_11

//红外夜视引脚
//B_LED: PD_0, R_LED: PD_1 
PIN_IRCUT_IN1        =   PD_5
PIN_IRCUT_IN2        =   PD_4
PIN_IRCUT_DETECT     =   PA_15
PIN_IRCUT_LED        =   PD_2
PIN_WHITE_LED        =   PD_3

PIN_SYS_PWR_EN       =   PD_13
PIN_PWR_KEY_DET      =   PB_7
PIN_TF_PWR_EN        =   PC_0
PIN_AUDIO_PA_EN      =   PB_6
PIN_VDD_CTRL         =   PC_1

//CW2015 SDA:PD_6, SCL:PD_7, INT:PD_12